<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Verify Your Sheltly Account</title>
    <style>
        @media screen and (max-width: 600px) {
            .content-table {
                width: 100% !important;
            }
            .otp-code {
                font-size: 28px !important;
                letter-spacing: 4px !important;
            }
        }
    </style>
</head>
<body style="margin: 0; padding: 0; background-color: #f4f7f9; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;">
    <center>
        <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #f4f7f9;">
            <tr>
                <td align="center" style="padding: 40px 10px;">
                    <table class="content-table" role="presentation" border="0" cellpadding="0" cellspacing="0" width="600" style="background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
                        
                        <tr>
                            <td align="center" style="padding: 30px 40px 10px 40px;">
                                <h1 style="margin: 0; color: #1a1a1a; font-size: 24px; font-weight: 700;">Sheltly</h1>
                            </td>
                        </tr>

                        <tr>
                            <td style="padding: 20px 40px; color: #444444; font-size: 16px; line-height: 1.6;">
                                <p style="margin: 0;">Hi {{ first_name }},</p>
                                <p>Welcome to <strong>Sheltly</strong>! You're one step away from finding your next home with AI-driven clarity.</p>
                                <p>Please use the verification code below to secure your account:</p>
                                
                                <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="margin: 30px 0;">
                                    <tr>
                                        <td align="center" style="background-color: #f8f9fa; border: 2px dashed #007bff; border-radius: 8px; padding: 25px;">
                                            <p class="otp-code" style="margin: 0; font-size: 36px; font-weight: bold; color: #007bff; letter-spacing: 10px; font-family: monospace;">{{ otp }}</p>
                                        </td>
                                    </tr>
                                </table>

                                <p style="font-size: 14px; color: #666666; text-align: center;">This code expires in <strong>10 minutes</strong> for your security.</p>
                            </td>
                        </tr>

                        
                    </table>
                </td>
            </tr>
        </table>
    </center>
</body>
</html>
